name: CI and release

on:
  push:
    branches: [main]
    tags: ["[0-9][0-9][0-9][0-9].*"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
        env:
          SOLAR_MOCK_LLM: "1"
      - run: bun run build
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate CalVer tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME (expected YYYY.MM.DD or YYYY.MM.DD.N)" >&2
            exit 1
          fi
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import sys
          from scripts.release_notes import tag_date
          tag_date(sys.argv[1])
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          mapfile -t RELEASE_TAGS < <(git tag --list | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' || true)
          PREV=""
          if ((${#RELEASE_TAGS[@]})); then
            PREV="$(printf '%s\n' "${RELEASE_TAGS[@]}" "$TAG" | sort -V -u | awk -v tag="$TAG" '$0 == tag { print prev; exit } { prev = $0 }')"
          fi
          ARGS=(--tag "$TAG" --image "ghcr.io/${GITHUB_REPOSITORY,,}" --output RELEASE_NOTES.md)
          if [[ -n "$PREV" ]]; then ARGS+=(--prev-tag "$PREV"); fi
          python3 scripts/release_notes.py "${ARGS[@]}"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          make_latest: true
